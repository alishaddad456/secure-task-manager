name: Secure Task Manager CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test, Scan, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          python -m pytest -v --tb=long \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=85

      - name: Run Bandit security scan
        run: bandit -r app -ll

      - name: Audit dependencies
        run: pip-audit -r requirements.txt

      - name: Build Docker image
        run: docker build -t secure-task-manager:test .

      - name: Test Docker container
        run: |
          set -eu

          container_name=secure-task-manager-ci
          trap 'docker rm -f "$container_name" >/dev/null 2>&1 || true' EXIT

          docker run -d \
            --name "$container_name" \
            -p 127.0.0.1:8000:8000 \
            secure-task-manager:test

          ready=0

          for i in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              ready=1
              break
            fi

            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            docker logs "$container_name"
            exit 1
          fi

          echo
          echo "Checking tasks endpoint..."
          curl --fail --silent --show-error \
            http://127.0.0.1:8000/tasks/

          echo
          echo "Checking task creation..."
          response=$(curl --fail --silent --show-error \
            -X POST http://127.0.0.1:8000/tasks/ \
            -H "Content-Type: application/json" \
            -d '{"title":"ci-smoke-test"}')

          echo "$response"
          echo "$response" | grep -q '"title":"ci-smoke-test"'

          echo "Docker runtime tests passed."
