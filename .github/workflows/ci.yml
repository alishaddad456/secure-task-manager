name: Secure Task Manager CI

on:
  push:
    branches: [main, phase-3-integration]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test, scan, and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: taskmanager_test
          POSTGRES_USER: taskmanager
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskmanager -d taskmanager_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://taskmanager:test_password@localhost:5432/taskmanager_test
      TEST_DATABASE_URL: postgresql+psycopg://taskmanager:test_password@localhost:5432/taskmanager_test

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run tests with coverage
        run: |
          python -m pytest -v --tb=long \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=85

      - name: Run Bandit
        run: bandit -r app -ll

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

      - name: Run Semgrep
        run: |
          python -m pip install semgrep
          semgrep scan --config auto --error app

      - name: Scan repository for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build --pull -t secure-task-manager:test .

      - name: Scan container image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            aquasec/trivy:0.58.2 image \
            --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL \
            secure-task-manager:test

      - name: Test Docker runtime
        run: |
          set -euo pipefail
          container_name=secure-task-manager-ci
          trap 'docker rm -f "$container_name" >/dev/null 2>&1 || true' EXIT

          docker run -d --name "$container_name" \
            -e DATABASE_URL=sqlite:////tmp/tasks.db \
            -p 127.0.0.1:8000:8000 \
            secure-task-manager:test

          ready=0
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/ready; then
              ready=1
              break
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            docker logs "$container_name"
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:8000/tasks/
          response=$(curl --fail --silent --show-error \
            -X POST http://127.0.0.1:8000/tasks/ \
            -H "Content-Type: application/json" \
            -d '{"title":"ci-smoke-test"}')
          echo "$response"
          echo "$response" | grep -q '"title":"ci-smoke-test"'

  terraform-security:
    name: Terraform validation and security scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Check Terraform formatting
        run: terraform fmt -diff -check -recursive terraform

      - name: Initialize Terraform without a backend
        run: terraform -chdir=terraform init -backend=false -input=false

      - name: Validate Terraform
        run: terraform -chdir=terraform validate

      - name: Install Checkov
        run: python -m pip install --disable-pip-version-check checkov

      - name: Scan Terraform with Checkov
        run: checkov -d terraform --framework terraform --compact --skip-check CKV_AWS_333,CKV_AWS_157,CKV_AWS_2,CKV_AWS_103,CKV2_AWS_20,CKV_AWS_378,CKV2_AWS_28,CKV_AWS_18,CKV_AWS_144,CKV_AWS_145,CKV2_AWS_62
