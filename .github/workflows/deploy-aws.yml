name: Deploy Secure Task Manager to AWS

on:
  workflow_dispatch:
  push:
    branches: [aws-infrastructure]
    paths:
      - "app/**"
      - "migrations/**"
      - "Dockerfile"
      - "requirements.txt"
      - ".github/workflows/deploy-aws.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-portfolio-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, migrate, and deploy to ECS
    runs-on: ubuntu-latest
    environment: aws-portfolio
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      ECS_TASK_FAMILY: ${{ vars.ECS_TASK_FAMILY }}
      ECS_CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME }}
      ECS_SUBNET_IDS: ${{ vars.ECS_SUBNET_IDS }}
      ECS_SECURITY_GROUP_ID: ${{ vars.ECS_SECURITY_GROUP_ID }}
      APP_BASE_URL: ${{ vars.APP_BASE_URL }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable image
        id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build --pull -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Register task definition with the new image
        id: task-definition
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          set -euo pipefail
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition > task-definition-source.json

          jq --arg IMAGE "$IMAGE_URI" --arg NAME "$ECS_CONTAINER_NAME" '
            .containerDefinitions |= map(if .name == $NAME then .image = $IMAGE else . end)
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
          ' task-definition-source.json > task-definition.json

          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition.json \
            --query taskDefinition.taskDefinitionArn --output text)
          echo "arn=$TASK_DEF_ARN" >> "$GITHUB_OUTPUT"

      - name: Run database migrations as a one-off ECS task
        env:
          TASK_DEF_ARN: ${{ steps.task-definition.outputs.arn }}
        run: |
          set -euo pipefail
          IFS=',' read -ra SUBNETS <<< "$ECS_SUBNET_IDS"
          SUBNET_LIST=$(printf '"%s",' "${SUBNETS[@]}")
          SUBNET_LIST="${SUBNET_LIST%,}"

          OVERRIDES=$(jq -n --arg NAME "$ECS_CONTAINER_NAME" \
            '{containerOverrides:[{name:$NAME,command:["alembic","upgrade","head"]}]}')

          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --launch-type FARGATE \
            --task-definition "$TASK_DEF_ARN" \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNET_LIST],securityGroups=[$ECS_SECURITY_GROUP_ID],assignPublicIp=ENABLED}" \
            --overrides "$OVERRIDES" \
            --query 'tasks[0].taskArn' --output text)

          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
            echo "ECS migration task could not be started."
            exit 1
          fi

          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"
          EXIT_CODE=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$EXIT_CODE" != "0" ]; then
            aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"
            echo "Database migration failed with exit code: $EXIT_CODE"
            exit 1
          fi

      - name: Deploy new task definition
        env:
          TASK_DEF_ARN: ${{ steps.task-definition.outputs.arn }}
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$TASK_DEF_ARN" \
            --desired-count 1
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

      - name: Verify deployed application
        run: |
          set -euo pipefail
          if [ -z "$APP_BASE_URL" ]; then
            echo "Set the APP_BASE_URL repository variable to the Terraform application_url output."
            exit 1
          fi
          curl --fail --show-error --retry 12 --retry-delay 10 --retry-connrefused "$APP_BASE_URL/ready"
