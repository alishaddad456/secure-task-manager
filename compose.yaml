services:
  api:
    build: .
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/tasks.db
    volumes:
      - task_data:/data
    restart: unless-stopped

volumes:
  task_data:
